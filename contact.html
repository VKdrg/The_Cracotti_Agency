<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jgthms/minireset.css@master/minireset.min.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="icon" href="images/goat.ico">
    <meta name="description" content="The contact page of the portfolio and biography of a famous goat">
</head>

<body>

    <header class="menu">
        <a href="index.html" class="nav-home">Goat</a>
        <nav class="nav">
            <a href="./index.html/#about" class="b1">About</a>
            <a href="./index.html/#projects" class="b1">Projects</a>
            <a href="https://philosophynow.org/issues/71/Everything_is_a_Goat" title="More about Goatism" class="b1">More</a>
            <a href="./contact.html" class="b1">Contact</a>
        </nav>
    </header>


    <main>
        <section class="landingscreen">
            <h1 class="main-title">Contact</h1>
        </section>

        <section class="contact">
            <form class="contactform">
                <div class="top">
                    <div class="news_input">
                        <label for="fname" class="b1 label">Name</label>
                        <input type="text" name="fname" id="Name" class="text-input">
                    </div>
                    <div class="news_input">
                        <label for="lname" class="b1 label">E-mail</label>
                        <input type="text" name="lname" id="E-mail" class="text-input">
                    </div>
                </div>

                <div class="content-input">
                    <label for="message" class="b1 label">Your message</label>
                    <textarea name="contents" id="content" class="text-area"></textarea>
                </div>

                <a href="images/🎉.mp4" title="Envoyer" class="cta">Offrir des croquettes</a>
            </form>
        </section>
    </main>


    <footer>
        <div class="b2">&#169; Sa Majesté Cracotte, 2025</div>
    </footer>

</body>

</html>
